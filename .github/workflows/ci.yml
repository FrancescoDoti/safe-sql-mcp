name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: curl -sSfL -o data/chinook.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python -m safesql.redteam
