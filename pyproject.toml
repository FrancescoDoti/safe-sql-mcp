[project]
name = "safesql"
version = "0.1.0"
description = "MCP server that gives an LLM agent read-only, policy-checked SQL access: AST validation, table and column allowlists, row caps, timeouts and an audit log, with a red-team test suite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
safesql-mcp = "safesql.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safesql"]
